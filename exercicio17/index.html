<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 17 — Loja de Tintas</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="exercicio17.css">
</head>
<body>
    <div class="container">

        <div class="input-card">
            <div class="icones">🎨 🖌️</div>
            <h2>Loja de Tintas</h2>
            <p>Saiba a quantidade de tinta e o preço total para pintar sua área</p>
            <label>Informe a área em m²</label>
            <div class="input-grupo">
                <input type="number" id="area" placeholder="Ex: 45" min="0">
                <span class="unidade">m²</span>
            </div>
            <button onclick="calcular()">Calcular</button>
        </div>

        <div class="resultados" id="resultados">
            <div class="card">
                <div class="card-icone">🪣</div>
                <h3>Situação 1</h3>
                <p class="subtitulo">Latas de 18L</p>
                <div class="valor" id="val1"></div>
            </div>
            <div class="card">
                <div class="card-icone">🫙</div>
                <h3>Situação 2</h3>
                <p class="subtitulo">Galões de 3,6L</p>
                <div class="valor" id="val2"></div>
            </div>
            <div class="card">
                <div class="card-icone">🪣🫙</div>
                <h3>Situação 3</h3>
                <p class="subtitulo">Mistura — menor preço</p>
                <div class="valor" id="val3"></div>
            </div>
        </div>

    </div>
    <script src="exercicio17.js"></script>
</body>
</html>
